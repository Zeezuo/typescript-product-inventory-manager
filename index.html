<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Inventory Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; grid-column: span 2; background: #0284c7; color: white; border: none; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background-color: #f8fafc; }
    .total { margin-top: 15px; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Product Inventory Manager</h1>

  <form id="product-form">
    <input type="text" id="name" placeholder="Product Name" required />
    <input type="text" id="category" placeholder="Category" required />
    <input type="number" id="price" placeholder="Price ($)" step="0.01" required />
    <input type="number" id="quantity" placeholder="Quantity" required />
    <button type="submit">Add Product</button>
  </form>

  <h2>Inventory List</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total Value</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="inventory-body"></tbody>
  </table>

  <div class="total">
    Total Inventory Value: $<span id="total-value">0.00</span>
  </div>

  <script src="./dist/index.js"></script>
</body>
</html>
